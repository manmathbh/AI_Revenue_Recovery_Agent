[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recoup"
version = "0.1.0"
description = "Recoup — bounded AI revenue recovery agent for Razorpay merchants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
recoup-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires a running Postgres + seeded dataset",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
exclude = ["alembic/", "scripts/"]
